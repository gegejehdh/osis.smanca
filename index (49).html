function toast(t,e){const d=document.createElement('div');d.className='ti'+(e?' e':'');d.textContent=t;$('#ts').append(d);setTimeout(()=>d.remove(),3600)}
function modal(h){$('#md').innerHTML=`<div class="md" data-act="mx"><div class="mb"><button class="x" data-act="mx">×</button>${h}</div></div>`}
const sh=(s,t,p)=>`<div class="sh"><small>${s}</small><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div>`;
const pgh=(t,p)=>`<div class="pgb"><div class="w"><h1>${t}</h1><p>${p}</p></div></div>`;
const none=t=>`<div class="emp"><div>📭</div><p>${t}</p></div>`;
const bgi=u=>`style="background-image:url('${esc(u)}')"`;
const pic=(x,k,cls='ph')=>x.foto?`<div class="${cls} imgb" ${bgi(x.foto)}></div>`:`<div class="${cls}" ${ph(x.title||x.name)}>${emo[k]}</div>`;
const mimg=x=>x.foto?`<img class="mimg" src="${esc(x.foto)}" alt="">`:'';
const av=(m,cls='av')=>m.foto?`<div class="${cls} imgb" ${bgi(m.foto)}></div>`:`<div class="${cls}" ${ph(m.name)}>${esc((m.name||'?').replace(/[\[\]]/g,'')[0]||'?')}</div>`;
const cardNews=n=>`<div class="c" style="cursor:pointer" data-act="news" data-id="${esc(n.id)}">${pic(n,'news')}<div class="cb"><span class="tag">${esc(n.type)} · ${esc(n.cat)}</span><h3>${esc(n.title)}</h3><p>${fd(n.date)}</p><p>${esc(String(n.body||'').slice(0,90))}…</p></div></div>`;
const cardProg=p=>`<div class="c">${pic(p,'programs')}<div class="cb"><span class="${sc(p.status)}">${esc(p.status)}</span> <span class="tag">${esc(p.field)}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><p>${p.goal?`<b>Tujuan:</b> ${esc(p.goal)}<br>`:''}${p.pic?`<b>PJ:</b> ${esc(p.pic)}<br>`:''}${p.time?`<b>Waktu:</b> ${esc(p.time)}`:''}</p></div></div>`;
const cardAct=a=>`<div class="c">${a.foto?pic(a,'activities'):''}<div class="cb"><span class="${sc(a.status)}">${esc(a.status)}</span><h3>${esc(a.name)}</h3><p>📅 ${fd(a.date)}${a.time?' · '+esc(a.time):''}${a.place?`<br>📍 ${esc(a.place)}`:''}</p><p>${esc(String(a.desc||'').slice(0,100))}</p><button class="btn b3 bs" data-act="act" data-id="${esc(a.id)}">Lihat Detail</button></div></div>`;
const cardRow=m=>`<div class="c ar">${av(m)}<div class="ai"><h3>${esc(m.name)}</h3><span class="tag">${esc(m.role)}</span>${m.kelas?` <span class="tag">${esc(m.kelas)}</span>`:''}${m.desc?`<p>${esc(m.desc)}</p>`:''}</div></div>`;
const ctaBlock=()=>`<div class="w"><div class="cta"><h2>Punya Ide, Kritik, atau Saran untuk Sekolah?</h2><p style="opacity:.9">Suara Kamu Penting bagi Kami!</p><a class="btn b1" href="#aspirasi">Kirim Aspirasi Sekarang</a></div></div>`;
const V={};
V.beranda=()=>{const c=cfg(),m=get('members'),P=get('programs'),A=get('activities'),N=get('news'),hero=c.hero||HERO,tot=m.length+P.length+A.length+statAsp,ms=L(c.mission);
const sec=(alt,s,t,list,fn)=>list.length?`<section${alt?' class="alt"':''}><div class="w">${sh(s,t)}<div class="g">${list.slice(0,3).map(fn).join('')}</div></div></section>`:'';
return`<div class="hero" style="background-image:url('${esc(hero)}')"><div class="w hg"><div><h1>Selamat Datang di Website Resmi OSIS</h1>${c.desc?`<p>${esc(c.desc)}</p>`:''}<p><a class="btn b1" href="#profil">Kenali OSIS Kami</a> <a class="btn b2" href="#aspirasi">Sampaikan Aspirasi</a></p></div></div></div>`
+(c.desc?`<section><div class="w g2"><div><div class="sh" style="text-align:left"><small>Tentang Kami</small><h2>Mengenal ${esc(c.name)}</h2></div><p>${esc(c.desc)}</p></div><div class="ab" ${bgi(hero)} role="img" aria-label="Foto OSIS"></div></div></section>`:'')
+(tot?`<section class="alt"><div class="w g sg">${[['Pengurus & Anggota',m.length],['Program Kerja',P.length],['Kegiatan',A.length],['Aspirasi Diterima',statAsp]].map(s=>`<div class="c st"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div></section>`:'')
+((c.vision||ms.length)?`<section><div class="w">${sh('Arah Organisasi','Visi dan Misi')}<div class="vm">${c.vision?`<div><h3>Visi</h3><p>${esc(c.vision)}</p></div>`:''}${ms.length?`<div><h3>Misi</h3><ol>${ms.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>`:''}</div></div></section>`:'')
+sec(1,'Unggulan','Program Kerja',P,cardProg)+sec(0,'Terbaru','Kegiatan Terbaru',[...A].sort((x,y)=>String(y.date).localeCompare(x.date)),cardAct)+sec(1,'Informasi','Berita dan Pengumuman',[...N].sort((x,y)=>String(y.date).localeCompare(x.date)),cardNews)+`<section>${ctaBlock()}</section>`};
V.profil=()=>{const c=cfg(),items=[['Sejarah OSIS',c.history&&`<p>${esc(c.history)}</p>`],['Tentang Organisasi',c.desc&&`<p>${esc(c.desc)}</p>`],['Tujuan Organisasi',c.goal&&`<p>${esc(c.goal)}</p>`],['Visi dan Misi',(c.vision||c.mission)&&`${c.vision?`<p><b>Visi:</b> ${esc(c.vision)}</p>`:''}${L(c.mission).length?`<ol>${L(c.mission).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}`],['Peran dan Fungsi',c.role&&`<p>${esc(c.role)}</p>`],['Nilai-Nilai Organisasi',L(c.values).length&&`<div class="g">${L(c.values).map(v=>`<div class="c st" style="padding:14px"><b style="font-size:18px">${esc(v)}</b></div>`).join('')}</div>`]].filter(x=>x[1]);
return pgh('Profil OSIS','Mengenal organisasi siswa kami.')+`<div class="w pf" style="padding-bottom:56px">${items.map((x,i)=>`<div class="c cb"${i===0&&items.length>1?' style="grid-column:1/-1"':''}><h3>${x[0]}</h3>${x[1]}</div>`).join('')||none('Informasi profil belum ditambahkan.')}</div>`};
V.pengurus=()=>{const m=get('members'),nd=x=>`<div class="nd">${x.foto?`<div class="nf imgb" ${bgi(x.foto)}></div>`:''}<small>${esc(x.role)}</small><b>${esc(x.name)}</b></div>`,row=l=>`<div class="lv">${l.map(nd).join('')}</div>`,vl='<i class="vl"></i>',
P=m.filter(x=>x.grp==='Pembina'),I=m.filter(x=>x.grp==='Inti'),K=I.filter(x=>/^Ketua/i.test(x.role)),W=I.filter(x=>/Wakil/i.test(x.role)),SB=I.filter(x=>!K.includes(x)&&!W.includes(x)).sort((x,y)=>String(x.role).localeCompare(y.role,'id',{numeric:true}));
const chart=[P,K,W,SB].filter(l=>l.length).map(row).join(vl);
return pgh('Kepengurusan','Struktur organisasi pengurus OSIS periode berjalan.')+`<div class="w" style="padding-bottom:56px">${chart?`<h3>Bagan Struktur Organisasi</h3><div class="org">${chart}</div><p style="text-align:center;margin-top:22px"><a class="btn b3" href="#anggota">Lihat Anggota OSIS →</a></p>`:none('Data kepengurusan belum ditambahkan.')}</div>`};
let flt={a:'',program:'Semua',kegiatan:'Semua',galeri:'Semua',q:''};
V.anggota=()=>{const A=get('members').filter(x=>!['Pembina','Inti'].includes(x.grp)),q=flt.a.toLowerCase(),r=A.filter(x=>(x.name+' '+x.role+' '+(x.kelas||'')+' '+(x.desc||'')).toLowerCase().includes(q));
return pgh('Anggota OSIS','Cari nama anggota OSIS.')+`<div class="w" style="padding-bottom:56px">${A.length?`<div class="fl"><input id="qa" type="search" placeholder="Cari nama anggota…" value="${esc(flt.a)}"></div><p style="color:var(--mu);margin:0 0 16px">Menampilkan ${r.length} dari ${A.length} anggota</p><div class="ag">${r.map(cardRow).join('')||'<p>Nama tidak ditemukan.</p>'}</div>`:none('Data anggota belum ditambahkan.')}</div>`};
const chips=(k,opts)=>`<div class="fl">${['Semua',...opts].map(o=>`<button class="${flt[k]===o?'on':''}" data-act="flt" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
V.program=()=>{const p=get('programs');return pgh('Program Kerja','Rencana dan program OSIS berdasarkan bidang.')+`<div class="w" style="padding-bottom:56px">${p.length?chips('program',[...new Set(p.map(x=>x.field))])+`<div class="g">${p.filter(x=>flt.program==='Semua'||x.field===flt.program).map(cardProg).join('')}</div>`:none('Program kerja belum ditambahkan.')}</div>`};
V.kegiatan=()=>{const a=[...get('activities')].sort((x,y)=>String(y.date).localeCompare(x.date));return pgh('Kegiatan','Agenda dan timeline kegiatan OSIS.')+`<div class="w" style="padding-bottom:56px">${a.length?chips('kegiatan',ST)+`<div class="tl">${a.filter(x=>flt.kegiatan==='Semua'||x.status===flt.kegiatan).map(cardAct).join('')}</div>`:none('Kegiatan belum ditambahkan.')}</div>`};
V.berita=(only)=>{const all=get('news'),n=[...all].sort((x,y)=>String(y.date).localeCompare(x.date)).filter(x=>(!only||x.type===only)&&(x.title+x.body+x.cat).toLowerCase().includes(flt.q.toLowerCase()));return pgh(only||'Berita & Pengumuman','Informasi terbaru dari OSIS.')+`<div class="w" style="padding-bottom:56px">${all.length?`<div class="fl"><input id="q" placeholder="Cari berita…" value="${esc(flt.q)}"></div><div class="g">${n.map(cardNews).join('')||'<p>Tidak ada hasil.</p>'}</div>`:none('Berita dan pengumuman belum ditambahkan.')}</div>`};
V.pengumuman=()=>V.berita('Pengumuman');
V.galeri=()=>{const g=get('gallery');return pgh('Galeri','Dokumentasi foto dan video kegiatan OSIS.')+`<div class="w" style="padding-bottom:56px">${g.length?chips('galeri',[...new Set(g.map(x=>x.cat))])+`<div class="g">${g.filter(x=>flt.galeri==='Semua'||x.cat===flt.galeri).map(x=>`<div class="c" style="cursor:pointer" data-act="lb" data-id="${esc(x.id)}">${pic(x,'gallery')}<div class="cb"><span class="tag">${esc(x.cat)}</span><h3 style="font-size:16px">${esc(x.title)}</h3></div></div>`).join('')}</div>`:none('Galeri belum ditambahkan.')}</div>`};
V.aspirasi=()=>pgh('Aspirasi Siswa','Sampaikan kritik, saran, ide, atau pengaduan. Aspirasi tidak ditampilkan secara publik dan hanya dibaca pengurus OSIS.')+`<div class="w" style="padding-bottom:50px"><form class="fm" id="af" novalidate><label>Identitas</label><div class="rd"><label><input type="radio" name="idn" value="anon" checked> Kirim anonim</label><label><input type="radio" name="idn" value="nama"> Tampilkan nama</label></div>
<div id="nmw" hidden><label>Nama</label><input name="nama" maxlength="60"><div class="er" data-e="nama"></div></div><label>Kelas</label><input name="kelas" maxlength="20" placeholder="mis. X-1"><div class="er" data-e="kelas"></div>
<label>Kategori aspirasi</label><select name="kat"><option value="">Pilih kategori…</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><div class="er" data-e="kat"></div>
<label>Subjek</label><input name="sub" maxlength="100"><div class="er" data-e="sub"></div><label>Isi kritik, saran, atau aspirasi</label><textarea name="isi" maxlength="2000"></textarea><div class="er" data-e="isi"></div>
<button class="btn b1" id="sb" style="width:100%;margin-top:8px">Kirim Aspirasi</button></form></div>`;
V.kontak=()=>{const c=cfg(),it=[['🏫','Alamat Sekolah',c.addr],['✉️','Email OSIS',c.email],['📸','Instagram',c.ig],['💬','WhatsApp',c.wa],['🏢','Sekretariat',c.sec]].filter(x=>x[2]);return pgh('Kontak','Hubungi OSIS kami.')+`<div class="w g" style="padding-bottom:56px">${it.map(x=>`<div class="c cb"><div style="font-size:28px">${x[0]}</div><h3 style="font-size:16px">${x[1]}</h3><p>${esc(x[2])}</p></div>`).join('')||none('Informasi kontak belum ditambahkan.')}</div>`};
// ---------- CORE ----------
function R(){const h=(location.hash||'#beranda').slice(1),v=V[h]?h:'beranda',c=cfg();
$('#m').innerHTML=V[v]();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));
$('#hn').textContent=c.name;document.querySelectorAll('.lg').forEach(i=>i.src=LOGO);document.querySelectorAll('.fn').forEach(e=>e.textContent=c.name);$('#fd').textContent=c.desc||'';$('#yr').textContent=new Date().getFullYear();$('#fc').innerHTML=[c.addr,c.email,c.ig,c.wa].filter(Boolean).map(x=>`<a>${esc(x)}</a>`).join('');
const af=$('#af');if(af)bindAsp(af)}
function bindAsp(f){f.idn.forEach(r=>r.onchange=()=>$('#nmw').hidden=f.idn.value==='anon');
f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f)),er={};
if(v.idn==='nama'&&v.nama.trim().length<2)er.nama='Nama wajib diisi.';if(!v.kelas.trim())er.kelas='Kelas wajib diisi.';if(!v.kat)er.kat='Pilih kategori.';if(v.sub.trim().length<5)er.sub='Subjek minimal 5 karakter.';if(v.isi.trim().length<20)er.isi='Isi minimal 20 karakter.';
f.querySelectorAll('[data-e]').forEach(x=>x.textContent=er[x.dataset.e]||'');if(Object.keys(er).length)return toast('Periksa kembali isian formulir.',1);
const b=$('#sb');b.disabled=true;b.textContent='Mengirim…';
const d={kelas:v.kelas.trim(),kat:v.kat,sub:v.sub.trim(),isi:v.isi.trim(),status:ASS[0],at:new Date().toISOString()};if(v.idn==='nama')d.nama=v.nama.trim();
try{if(fb){await fs.collection('aspirations').add(d);try{await fs.doc('stats/asp').set({n:firebase.firestore.FieldValue.increment(1)},{merge:true})}catch{}}else{loc.push(d);localStorage.setItem('osisAsp',JSON.stringify(loc))}
f.reset();$('#nmw').hidden=true;modal(`<h3>Aspirasi Berhasil Disampaikan ✓</h3><p>Terima kasih. Aspirasi Anda akan ditinjau pengurus OSIS.${fb?'':' (Mode demo: disimpan di perangkat ini karena belum masuk ke sistem.)'}</p>`);toast('Aspirasi berhasil dikirim.')}
catch(x){toast('Gagal mengirim aspirasi. Coba lagi.',1)}b.disabled=false;b.textContent='Kirim Aspirasi'}}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id,c=t.dataset.c;
if(a==='mx'){if(e.target===t||t.classList.contains('x'))$('#md').innerHTML='';return}
if(a==='soc'){e.preventDefault();toast('Tautan media sosial resmi belum diatur: '+(cfg().ig));return}
if(a==='flt'){flt[t.dataset.k]=t.dataset.v;return R()}
if(a==='news'){const n=get('news').find(x=>x.id===id);modal(`${mimg(n)}<span class="tag">${esc(n.type)} · ${esc(n.cat)}</span><h2>${esc(n.title)}</h2><p style="color:var(--mu)">${fd(n.date)}</p><p style="white-space:pre-wrap">${esc(n.body)}</p>`)}
if(a==='act'){const n=get('activities').find(x=>x.id===id);modal(`${mimg(n)}<span class="${sc(n.status)}">${esc(n.status)}</span><h2>${esc(n.name)}</h2><p>📅 ${fd(n.date)}${n.time?' · '+esc(n.time):''}${n.place?`<br>📍 ${esc(n.place)}`:''}</p><p>${esc(n.desc)}</p>`)}
if(a==='lb'){const g=get('gallery').find(x=>x.id===id);modal(`${mimg(g)}<h3 style="margin-top:12px">${esc(g.title)}</h3><span class="tag">${esc(g.cat)}</span>`)}
});
document.addEventListener('input',e=>{if(e.target.id==='qa'){flt.a=e.target.value;const p=e.target.selectionStart;R();const q=$('#qa');q.focus();q.setSelectionRange(p,p)}if(e.target.id==='q'){flt.q=e.target.value;const p=e.target.selectionStart;R();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
$('#hb').onclick=()=>$('#nv').classList.toggle('open');$('#nv').onclick=e=>{if(e.target.closest('a'))$('#nv').classList.remove('open')};
addEventListener('hashchange',()=>{R();scrollTo(0,0)});R();
if(fb){firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();
const sub=(c,fn)=>fs.collection(c).onSnapshot(sn=>{fn(sn.docs.map(d=>({id:d.id,...d.data()})));R()},()=>{});
COL.forEach(c=>sub(c,r=>S[c]=r));sub('settings',r=>S.settings=(r.find(x=>x.id==='main')||{}));
fs.doc('stats/asp').onSnapshot(sn=>{statAsp=sn.exists?sn.data().n:0;R()},()=>{})}
</script></body></html>
