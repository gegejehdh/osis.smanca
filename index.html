<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Admin OSIS</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14264f"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#14264f;--blue:#2a4a95;--bd:#dde4f2;--mu:#566285;--tx:#1b2438;--bg:#f4f6fb;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:env(safe-area-inset-bottom,0)}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#0e1b3d,#1d3670);color:#fff;padding:calc(10px + env(safe-area-inset-top,0)) 14px 0}
.bar{display:flex;align-items:center;gap:10px;height:44px}.bar img{width:34px;height:34px;border-radius:50%;background:#fff}.bar b{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 0 0;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;color:#fff;opacity:.75;padding:10px 12px;font:inherit;font-size:14px;border-bottom:3px solid transparent;cursor:pointer}.tabs button.on{opacity:1;border-color:#8fb3ff}
main{max-width:860px;margin:auto;padding:16px}
h2{margin:4px 0 12px;font-size:20px}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.btn.s{padding:6px 12px;font-size:13px}.btn.r{background:var(--red)}.btn.g{background:#e8effc;color:var(--navy)}.btn:disabled{opacity:.6}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:6px 0 4px;font-size:16px}.card p{margin:4px 0;color:var(--mu);font-size:14px}
.tag{display:inline-block;background:#e8effc;color:var(--navy);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;margin-right:4px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx)}textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px}.item>div:first-child{min-width:0}.item small{color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sum .card{text-align:center;margin:0}.sum b{display:block;font-size:30px;color:var(--blue)}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login .card{padding:22px}.login img{width:72px;height:72px;border-radius:50%;display:block;margin:0 auto 10px}
.md{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:12px;overflow:auto}.mb{background:#fff;border-radius:16px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
#ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:60;display:grid;gap:8px}.ti{background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px}.ti.e{background:var(--red)}
.er{color:var(--red);font-size:13px;min-height:18px}.nt{background:#e8effc;border:1px solid #8fb3ff;border-radius:12px;padding:12px 14px;font-size:14px}
</style></head><body>

const D={settings:{name:'OSIS UPTD SMAN 1 CAMPALAGIAN',school:'UPTD SMAN 1 CAMPALAGIAN',desc:'Organisasi Siswa Intra Sekolah: wadah kepemimpinan, kreativitas, dan kolaborasi siswa.',addr:'[Alamat sekolah]',email:'osis@contoh.sch.id',ig:'@osis_contoh',wa:'[Nomor WhatsApp]',sec:'[Lokasi & jam sekretariat]',vision:'Mewujudkan organisasi siswa yang aktif, kreatif, disiplin, dan berintegritas.',mission:'Meningkatkan partisipasi siswa dalam kegiatan positif\nMendorong kepemimpinan dan kolaborasi\nMenyelenggarakan program kerja yang inovatif dan terukur\nMenjadi jembatan komunikasi siswa, guru, dan sekolah',history:'[Tuliskan sejarah singkat berdirinya OSIS di sekolah Anda melalui Dashboard Admin → Pengaturan.]',values:'Integritas\nKolaborasi\nKreativitas\nTanggung Jawab'}};
D.news=[{id:'d1',title:'Contoh Berita: Pelantikan Pengurus Baru',type:'Berita',cat:'Organisasi',date:'2026-07-20',body:'Ini adalah contoh isi berita. Ganti melalui Dashboard Admin.'},{id:'d2',title:'Contoh Pengumuman: Open Recruitment Anggota',type:'Pengumuman',cat:'Pengumuman',date:'2026-08-02',body:'Contoh pengumuman. Ubah atau hapus melalui Dashboard Admin.'},{id:'d3',title:'Contoh Berita: Lomba Kebersihan Kelas',type:'Berita',cat:'Kegiatan',date:'2026-09-05',body:'Contoh isi berita kedua.'}];
D.programs=[{id:'d1',name:'Masa Pengenalan Organisasi',field:'Kaderisasi',desc:'Orientasi calon pengurus dan anggota.',goal:'Menumbuhkan jiwa kepemimpinan.',pic:'[Koordinator Bidang]',time:'Semester 1',status:'Selesai'},{id:'d2',name:'Bakti Sosial Sekolah',field:'Sosial',desc:'Kegiatan peduli lingkungan dan sesama.',goal:'Meningkatkan kepedulian sosial.',pic:'[Koordinator Bidang]',time:'Semester 2',status:'Sedang Berjalan'},{id:'d3',name:'Pekan Seni dan Olahraga',field:'Minat Bakat',desc:'Ajang kreativitas dan sportivitas siswa.',goal:'Menyalurkan minat dan bakat.',pic:'[Koordinator Bidang]',time:'Semester 2',status:'Direncanakan'}];
D.activities=[{id:'d1',name:'Rapat Kerja OSIS',date:'2026-08-10',time:'08:00',place:'[Lokasi]',desc:'Penyusunan program kerja satu periode.',status:'Selesai'},{id:'d2',name:'Jumat Bersih',date:'2026-12-04',time:'07:00',place:'[Lokasi]',desc:'Gotong royong membersihkan lingkungan sekolah.',status:'Direncanakan'}];
D.gallery=[{id:'d1',title:'Contoh Dokumentasi Upacara',kind:'Foto',cat:'Upacara'},{id:'d2',title:'Contoh Dokumentasi Rapat',kind:'Foto',cat:'Rapat'},{id:'d3',title:'Contoh Video Profil OSIS',kind:'Video',cat:'Profil'},{id:'d4',title:'Contoh Dokumentasi Bakti Sosial',kind:'Foto',cat:'Sosial'}];
D.members=[{id:'d1',name:'[Nama Pembina]',role:'Pembina OSIS',grp:'Pembina',desc:'Guru pembina OSIS.'},{id:'d2',name:'[Nama Ketua]',role:'Ketua OSIS',grp:'Inti',desc:'Memimpin organisasi.'},{id:'d3',name:'[Nama Wakil]',role:'Wakil Ketua',grp:'Inti',desc:'Mendampingi ketua.'},{id:'d4',name:'[Nama Sekretaris 1]',role:'Sekretaris 1',grp:'Inti',desc:'Administrasi organisasi.'},{id:'d5',name:'[Nama Sekretaris 2]',role:'Sekretaris 2',grp:'Inti',desc:'Membantu administrasi organisasi.'},{id:'d6',name:'[Nama Bendahara 1]',role:'Bendahara 1',grp:'Inti',desc:'Mengelola keuangan.'},{id:'d7',name:'[Nama Bendahara 2]',role:'Bendahara 2',grp:'Inti',desc:'Membantu mengelola keuangan.'},{id:'d8',name:'[Nama Anggota]',role:'Anggota OSIS',grp:'Anggota',desc:'Anggota OSIS.'},{id:'d9',name:'[Nama Anggota]',role:'Anggota OSIS',grp:'Anggota',desc:'Anggota OSIS.'},{id:'d10',name:'[Nama Anggota]',role:'Anggota OSIS',grp:'Anggota',desc:'Anggota OSIS.'}];
const COL=['news','programs','activities','gallery','members'];
const S={news:[],programs:[],activities:[],gallery:[],members:[],asp:[],settings:{}};let tab='asp',user=null,fs,au,subs=[];
const ok=!String(FIREBASE_CONFIG.apiKey).startsWith('ISI');
const fd=d=>{try{return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}catch{return d||''}};
function toast(t,e){const d=document.createElement('div');d.className='ti'+(e?' e':'');d.textContent=t;$('#ts').append(d);setTimeout(()=>d.remove(),3400)}
function modal(h){$('#md').innerHTML=`<div class="md" data-a="mx"><div class="mb">${h}</div></div>`}
function login(msg){$('#app').innerHTML=`<div class="login"><div class="card"><img src="${LOGO}" alt=""><h2 style="text-align:center">Admin OSIS</h2>${ok?'':'<div class="nt">Konfigurasi Firebase belum diisi (lihat PANDUAN.md).</div>'}<label>Email</label><input id="em" type="email" autocomplete="username"><label>Kata sandi</label><input id="pw" type="password" autocomplete="current-password"><div class="er">${esc(msg||'')}</div><button class="btn" style="width:100%" data-a="in">Masuk</button></div></div>`}
function listen(){subs.forEach(u=>u());subs=[];
COL.forEach(c=>subs.push(fs.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>toast('Tidak punya akses: '+c,1))));
subs.push(fs.collection('settings').doc('main').onSnapshot(s=>{S.settings=s.exists?s.data():{};draw()}));
subs.push(fs.collection('aspirations').onSnapshot(s=>{S.asp=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.at).localeCompare(a.at));draw()},e=>toast('Tidak punya akses aspirasi',1)))}
function row(c,r){const f=F[c];return`<div class="card item"><div><b>${esc(r[f[0][0]])}</b><br><small>${esc(r[f[1][0]]||'')}${c==='members'?' · '+esc(r.grp||''):''}</small></div><div class="row" style="margin:0;flex:none"><button class="btn s g" data-a="ed" data-c="${c}" data-id="${esc(r.id)}">Edit</button><button class="btn s r" data-a="del" data-c="${c}" data-id="${esc(r.id)}">Hapus</button></div></div>`}
function draw(){if(!user)return;let b='';
if(tab==='sum')b=`<div class="sum">${[['Aspirasi masuk',S.asp.length],['Menunggu ditinjau',S.asp.filter(a=>a.status===ASS[0]).length],['Berita',S.news.length],['Program',S.programs.length],['Kegiatan',S.activities.length],['Galeri',S.gallery.length],['Pengurus & anggota',S.members.length]].map(x=>`<div class="card"><b>${x[1]}</b>${x[0]}</div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Data awal</h3><p>Isi database dengan struktur dan contoh data (pengurus, program, kegiatan, berita, galeri, profil). Hanya mengisi bagian yang masih kosong.</p><button class="btn" data-a="seed">Isi data awal ke database</button></div>`;
else if(tab==='asp')b=S.asp.length?S.asp.map(a=>`<div class="card"><span class="tag">${esc(a.kat)}</span><span class="tag">${esc(a.kelas)}</span><span class="tag">${a.nama?esc(a.nama):'Anonim'}</span> <small>${fd(a.at)}</small><h3>${esc(a.sub)}</h3><p style="white-space:pre-wrap;color:var(--tx)">${esc(a.isi)}</p><label>Status</label><select id="st-${esc(a.id)}">${ASS.map(s=>`<option${s===a.status?' selected':''}>${s}</option>`).join('')}</select><label>Tanggapan OSIS</label><textarea id="rs-${esc(a.id)}" style="min-height:70px">${esc(a.resp||'')}</textarea><div class="row"><button class="btn s" data-a="asave" data-id="${esc(a.id)}">Simpan</button><button class="btn s r" data-a="adel" data-id="${esc(a.id)}">Hapus</button></div></div>`).join(''):'<p>Belum ada aspirasi masuk.</p>';
else if(tab==='settings')b=`<button class="btn" data-a="ed" data-c="settings" data-id="main">Ubah identitas &amp; profil OSIS</button>`;
else b=`<p><button class="btn" data-a="ed" data-c="${tab}">+ Tambah</button></p>`+(S[tab].map(r=>row(tab,r)).join('')||'<p>Belum ada data. Website publik memakai contoh sampai Anda menambah data.</p>');
$('#app').innerHTML=`<div class="top"><div class="bar"><img src="${LOGO}" alt=""><b>Admin OSIS</b><button class="btn s g" data-a="out">Keluar</button></div><div class="tabs">${Object.keys(TT).map(k=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${TT[k]}</button>`).join('')}</div></div><main><h2>${TT[tab]}</h2>${b}</main>`;
const ae=document.activeElement}
function form(c,id){const r=c==='settings'?S.settings:(S[c].find(x=>x.id===id)||{});modal(`<h3>${id?'Edit':'Tambah'} ${TT[c]}</h3><form id="ef" data-c="${c}" data-id="${esc(id||'')}">${F[c].map(f=>`<label>${f[1]}</label>${f[2]==='ta'?`<textarea name="${f[0]}">${esc(r[f[0]])}</textarea>`:Array.isArray(f[2])?`<select name="${f[0]}">${f[2].map(o=>`<option${o===r[f[0]]?' selected':''}>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]||'text'}" value="${esc(r[f[0]])}">`}`).join('')}<div class="row"><button class="btn">Simpan</button><button type="button" class="btn g" data-a="mx2">Batal</button></div></form>`)}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,c=t.dataset.c;
if(a==='mx'){if(e.target===t)$('#md').innerHTML='';return}if(a==='mx2'){$('#md').innerHTML='';return}
if(a==='tab'){tab=t.dataset.v;draw();return}
if(a==='in'){const em=$('#em').value.trim(),pw=$('#pw').value;if(!ok)return login('Isi konfigurasi Firebase dulu.');t.disabled=true;try{await au.signInWithEmailAndPassword(em,pw)}catch(x){login('Email atau kata sandi salah.')}return}
if(a==='out'){au.signOut();return}
if(a==='ed'){form(c,id);return}
try{if(a==='del'&&confirm('Hapus data ini?')){await fs.collection(c).doc(id).delete();toast('Data dihapus.')}
if(a==='adel'&&confirm('Hapus aspirasi ini?')){await fs.collection('aspirations').doc(id).delete();toast('Aspirasi dihapus.')}
if(a==='seed'){t.disabled=true;let n=0;for(const k of COL)if(!S[k].length)for(const r of D[k]){const{id:_,...d}=r;await fs.collection(k).doc(k+'-'+r.id).set(d);n++}
if(!Object.keys(S.settings).length){await fs.collection('settings').doc('main').set(D.settings);n++}toast(n?'Data awal dimuat ('+n+' data).':'Database sudah terisi.');t.disabled=false}
if(a==='asave'){await fs.collection('aspirations').doc(id).update({status:$('#st-'+id).value,resp:$('#rs-'+id).value});toast('Aspirasi diperbarui.')}}catch(x){toast('Aksi gagal: '+(x.message||''),1)}});
document.addEventListener('submit',async e=>{if(e.target.id!=='ef')return;e.preventDefault();const f=e.target,c=f.dataset.c,id=f.dataset.id,d=Object.fromEntries(new FormData(f));
if(c!=='settings')for(const x of F[c])if(!String(d[x[0]]||'').trim()&&x[0]!=='desc')return toast('Semua kolom wajib diisi.',1);
try{await fs.collection(c).doc(c==='settings'?'main':id||Date.now().toString(36)).set(d);$('#md').innerHTML='';toast('Data berhasil disimpan.')}catch(x){toast('Gagal menyimpan: '+(x.message||''),1)}});
if(ok){firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();au=firebase.auth();au.onAuthStateChanged(u=>{user=u;if(u){listen();draw()}else{subs.forEach(x=>x());subs=[];login()}})}else login();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
