section:has(>.w>.cta){display:block;padding:8px 0 24px}
.cta{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;column-gap:28px;align-items:center;text-align:left;border-radius:24px;padding:30px 36px;background:linear-gradient(120deg,#0f2557,#1f4bb8);box-shadow:0 18px 36px -22px #1f4bb8aa}
.cta:before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;border:24px solid #ffffff12}
.cta>*{position:relative;z-index:1}
.cta h2{grid-column:1;font-size:clamp(20px,2.6vw,27px);font-weight:800;letter-spacing:-.02em;color:#fff;margin:0 0 4px}
.cta p{grid-column:1;margin:0;font-size:15px;color:#dbe6ff;opacity:1!important}
.cta .btn,.cta .b1{grid-column:2;grid-row:1/3;margin:0;padding:13px 26px;font-size:15px;background:#ffd24a;color:#0f2557;box-shadow:0 8px 18px -8px #0007;white-space:nowrap}
.cta .btn:hover{background:#ffe07a}
@media(max-width:700px){.cta{grid-template-columns:1fr;text-align:center;padding:26px 20px;row-gap:4px}.cta .btn,.cta .b1{grid-column:1;grid-row:auto;justify-self:center;margin-top:14px}}

/* kondisi kosong */
.emp{border:2px dashed #cbd8f4;border-radius:28px;background:#f7faff;padding:60px 20px}
.emp div{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;background:#e3ebff;color:#1f4bb8;display:grid;place-items:center;font-size:38px}
.emp p{font-size:16px}

/* footer */
footer a{transition:color .2s}footer a:hover{color:#ffd24a}
footer h4{font-size:16px;display:inline-block;padding-bottom:6px;border-bottom:3px solid #ffd24a}
.hx .hxt h1 .hl{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;-webkit-text-fill-color:#ffd24a;color:#ffd24a!important;text-shadow:0 4px 18px #0b1d4a66}

/* peta lokasi */
.mp{background:#fff;border:1px solid #dfe7f7;border-radius:26px;overflow:hidden;box-shadow:0 18px 40px -26px #1f4bb880}
.mph{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 22px;border-bottom:3px solid #ffd24a}
.mph h3{margin:0 0 2px;font-size:18px}.mph p{margin:0;color:var(--mu);font-size:14px}
.mp iframe{display:block;width:100%;height:clamp(280px,46vw,420px);border:0}

/* perapian teks peta & kontak */
.mph{padding:20px 24px;gap:16px 20px}
.mph>div{flex:1 1 260px;min-width:0}
.mph h3{font-size:19px;line-height:1.3;margin:0 0 4px}

.mph .btn .ii{margin:0;width:1.2em;height:1.2em;vertical-align:0}
@media(max-width:560px){.mph{padding:16px}.mph .btn{width:100%}}
.cb p{line-height:1.6;overflow-wrap:anywhere}
